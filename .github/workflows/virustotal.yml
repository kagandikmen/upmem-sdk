name: VirusTotal Scan

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            **/*.tar.gz
            **/*.deb
            **/*.sh

      - name: Write summary
        if: always()
        run: |
          echo "## VirusTotal Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.vt.outputs.analysis }}" ]; then
            echo "${{ steps.vt.outputs.analysis }}" | tr ',' '\n' | while read line; do
              file="${line%%=*}"
              url="${line#*=}"
              echo "- [\`$file\`]($url)" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "_No files were scanned._" >> $GITHUB_STEP_SUMMARY
          fi